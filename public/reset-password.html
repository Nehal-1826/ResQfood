<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | ResQfood</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/auth.css">
  <style>
    /* Input with icons */
    .input-icon-wrap { position: relative; }
    .input-icon-wrap svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--gray-400); }
    .input-icon-wrap .form-control { padding-left: 2.5rem; }
    .auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--gray-50); }
  </style>
</head>
<body>

  <div id="toast-container"></div> <!-- Global toasts container -->

  <div class="auth-page" style="display: flex; justify-content: center;">
    
    <!-- Centered Panel (Forms) -->
    <div class="auth-form-section" style="max-width: 500px; width: 100%; box-shadow: var(--shadow-xl); border-radius: var(--radius-lg);">
      <div class="auth-form-box" style="padding: 3rem;">
        
        <div style="text-align: center; margin-bottom: 2rem;">
          <a href="/" class="auth-panel__logo" style="color: var(--gray-900); justify-content: center; margin-bottom: 1.5rem;">
            <img src="/images/logo.png" alt="ResQfood Logo">
          </a>
          <h2 style="font-size: 1.5rem; color: var(--gray-900); margin-bottom: 0.5rem;">Create new password</h2>
          <p style="color: var(--gray-500); font-size: 0.95rem;">Your new password must be different from previous used passwords.</p>
        </div>

        <form id="resetPasswordForm">
          <input type="hidden" id="resetToken" name="token">
          
          <div class="form-group">
            <label class="form-label">New Password</label>
            <div class="input-icon-wrap">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input type="password" id="regPassword" name="newPassword" class="form-control" placeholder="Create a strong password" required>
            </div>
            
            <div class="password-strength">
              <div class="password-strength__label">Password Requirements:</div>
              <div class="password-rules">
                <div class="password-rule" id="rule-length">
                  <span class="rule-icon">〇</span> 8+ characters
                </div>
                <div class="password-rule" id="rule-upper">
                  <span class="rule-icon">〇</span> 1 uppercase
                </div>
                <div class="password-rule" id="rule-lower">
                  <span class="rule-icon">〇</span> 1 lowercase
                </div>
                <div class="password-rule" id="rule-number">
                  <span class="rule-icon">〇</span> 1 number
                </div>
                <div class="password-rule" id="rule-special" style="grid-column: span 2;">
                  <span class="rule-icon">〇</span> 1 special char (!@#$%)
                </div>
              </div>
            </div>
          </div>

          <div class="form-group" style="margin-top: 1rem;">
            <label class="form-label">Confirm Password</label>
            <div class="input-icon-wrap">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="Confirm your new password" required>
            </div>
            <div id="passwordMatch" style="font-size: 0.75rem; margin-top: 0.25rem;"></div>
          </div>

          <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1.5rem" id="resetBtn" disabled>
            <span class="btn-text">Reset Password</span>
            <div class="spinner"></div>
          </button>
        </form>

      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/password.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirm Pickup | ResQfood</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body style="background: var(--gray-50); min-height: 100vh; display: flex; flex-direction: column;">

  <div id="toast-container"></div>

  <nav class="navbar" style="background: var(--white); box-shadow: var(--shadow-sm);">
    <div class="container">
      <a href="/" class="navbar__logo">
        <img src="/images/logo.png" alt="ResQfood Logo">
      </a>
      <div class="navbar__actions">
        <button onclick="window.history.back()" class="btn btn-outline btn-sm">Cancel</button>
      </div>
    </div>
  </nav>

  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 3rem 1.5rem;">
    <div class="card fade-in" style="width: 100%; max-width: 500px; padding: 2.5rem; text-align: center;">
      
      <div style="width: 80px; height: 80px; background: var(--green-50); color: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem;">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      </div>

      <h2 style="color: var(--gray-900); margin-bottom: 0.5rem; font-size: 1.75rem;">Confirm Food Pickup</h2>
      <p style="color: var(--gray-500); margin-bottom: 2rem; font-size: 0.95rem;">Please confirm only after you have physically collected the food from the restaurant.</p>

      <div style="background: var(--gray-50); border: 1px dashed var(--gray-300); border-radius: var(--radius-md); padding: 1.5rem; text-align: left; margin-bottom: 2rem;">
        <h5 style="color: var(--gray-700); margin-bottom: 1rem; border-bottom: 1px solid var(--gray-200); padding-bottom: 0.5rem;">Pickup Details</h5>
        
        <div style="display: flex; flex-direction: column; gap: 0.75rem;">
          <div style="display: flex; justify-content: space-between;">
            <span style="color: var(--gray-500); font-size: 0.85rem;">Food Item:</span>
            <span id="foodName" style="color: var(--gray-900); font-weight: 600; font-size: 0.9rem;">Loading...</span>
          </div>
          <div style="display: flex; justify-content: space-between;">
            <span style="color: var(--gray-500); font-size: 0.85rem;">Restaurant:</span>
            <span id="restaurantName" style="color: var(--gray-900); font-weight: 500; font-size: 0.9rem;">--</span>
          </div>
          <div style="display: flex; justify-content: space-between;">
            <span style="color: var(--gray-500); font-size: 0.85rem;">Date:</span>
            <span id="currentDate" style="color: var(--gray-900); font-weight: 500; font-size: 0.9rem;">--</span>
          </div>
        </div>
      </div>

      <button id="confirmBtn" class="btn btn-primary btn-lg btn-block" style="padding: 1rem;">
        <span class="btn-text">Yes, I Have Collected The Food</span>
        <div class="spinner"></div>
      </button>

      <div id="successMsg" style="display: none; margin-top: 2rem;">
        <h4 style="color: var(--green-600); margin-bottom: 0.5rem;">Success!</h4>
        <p style="color: var(--gray-600); font-size: 0.9rem; margin-bottom: 1.5rem;">Thank you for reducing food waste and helping the community.</p>
        <a href="/ngo-dashboard.html" class="btn btn-outline btn-block">Return to Dashboard</a>
      </div>

    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/pickup.js"></script>
</body>
</html>

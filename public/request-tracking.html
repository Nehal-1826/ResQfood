<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request Tracking | ResQfood</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/listings.css">
</head>
<body style="background: var(--gray-50); min-height: 100vh; display: flex; flex-direction: column;">

  <div id="toast-container"></div>

  <!-- Navbar -->
  <nav class="navbar" style="background: var(--white); box-shadow: var(--shadow-sm);">
    <div class="container">
      <a href="/" class="navbar__logo">
        <img src="/images/logo.png" alt="ResQfood Logo">
      </a>
      <div class="navbar__actions">
        <a href="/ngo-dashboard.html" class="btn btn-outline btn-sm">Back to Dashboard</a>
      </div>
    </div>
  </nav>

  <main style="flex: 1; padding: 3rem 0;">
    <div class="container" style="max-width: 800px;">
      
      <div style="margin-bottom: 2rem;">
        <h2 style="color: var(--gray-900);">Track Your Request</h2>
        <p style="color: var(--gray-500); margin-top: 0.25rem;">Monitor the status of your food pickup request.</p>
      </div>

      <div class="card" style="padding: 2rem; margin-bottom: 2rem;">
        <div style="display: flex; gap: 1.5rem; align-items: flex-start; margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--gray-100);">
          <div id="foodImgWrap" style="width: 100px; height: 100px; border-radius: var(--radius-md); background: var(--gray-100); flex-shrink: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; color: var(--green-500); font-weight: bold; font-size: 1.5rem;">
            <!-- Img or placeholder -->
          </div>
          <div style="flex: 1;">
            <div style="display: flex; justify-content: space-between; align-items: flex-start;">
              <h3 id="foodName" style="color: var(--gray-900); margin-bottom: 0.5rem;">Loading...</h3>
              <span id="currentStatusBadge" class="badge badge-pending">Pending</span>
            </div>
            <p id="foodQuantity" style="font-size: 0.95rem; color: var(--gray-600); margin-bottom: 0.5rem; font-weight: 500;">Qty: --</p>
            <div style="display: flex; flex-direction: column; gap: 0.35rem; font-size: 0.85rem; color: var(--gray-500);">
              <div style="display: flex; gap: 0.5rem;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> <span id="foodExpiry">Expires: --</span></div>
              <div style="display: flex; gap: 0.5rem;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="10" r="3"/><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/></svg> <span id="restaurantAddress">--</span></div>
              <div style="display: flex; gap: 0.5rem;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg> <span id="restaurantPhone">--</span></div>
            </div>
          </div>
        </div>

        <h4 style="margin-bottom: 1.5rem; color: var(--gray-800);">Status Timeline</h4>
        <div class="tracking-timeline" id="trackingTimeline">
          <!-- JS injected -->
          <div style="text-align: center; padding: 2rem;"><div class="spinner" style="border-top-color: var(--primary); margin: 0 auto; display: block;"></div></div>
        </div>
      </div>

      <!-- Action Area for 'Accepted' status -->
      <div id="pickupActionArea" style="display: none; text-align: center; margin-top: 3rem;">
        <h4 style="color: var(--gray-900); margin-bottom: 0.5rem;">Ready to collect?</h4>
        <p style="color: var(--gray-500); margin-bottom: 1.5rem;">Head to the restaurant address before the expiry time.</p>
        <button id="goToConfirmBtn" class="btn btn-primary btn-lg">Tap to Confirm Pickup</button>
      </div>

    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/tracking.js"></script>
</body>
</html>

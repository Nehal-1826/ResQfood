<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | ResQfood</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/auth.css">
  <style>
    /* Input with icons */
    .input-icon-wrap { position: relative; }
    .input-icon-wrap svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--gray-400); }
    .input-icon-wrap .form-control { padding-left: 2.5rem; }
    .auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--gray-50); }
  </style>
</head>
<body>

  <div id="toast-container"></div> <!-- Global toasts container -->

  <div class="auth-page" style="display: flex; justify-content: center;">
    
    <!-- Centered Panel (Forms) -->
    <div class="auth-form-section" style="max-width: 500px; width: 100%; box-shadow: var(--shadow-xl); border-radius: var(--radius-lg);">
      <div class="auth-form-box" style="padding: 3rem;">
        
        <div style="text-align: center; margin-bottom: 2rem;">
          <a href="/" class="auth-panel__logo" style="color: var(--gray-900); justify-content: center; margin-bottom: 1.5rem;">
            <img src="/images/logo.png" alt="ResQfood Logo">
          </a>
          <h2 style="font-size: 1.5rem; color: var(--gray-900); margin-bottom: 0.5rem;">Reset your password</h2>
          <p style="color: var(--gray-500); font-size: 0.95rem;">Enter your email address and role, and we'll send you a link to reset your password.</p>
        </div>

        <form id="forgotPasswordForm">
          <div class="form-group">
            <label class="form-label">I am a</label>
            <select name="role" class="form-control" required style="cursor: pointer;">
              <option value="restaurant">Restaurant</option>
              <option value="organization">Organization</option>
              <option value="volunteer">Volunteer</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Email Address</label>
            <div class="input-icon-wrap">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              <input type="email" name="email" class="form-control" placeholder="Email associated with your account" required>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1.5rem" id="forgotBtn">
            <span class="btn-text">Send Reset Link</span>
            <div class="spinner"></div>
          </button>
        </form>

        <div style="text-align: center; margin-top: 2rem;">
          <a href="/auth.html" style="color: var(--primary); font-weight: 500; text-decoration: none; display: inline-flex; align-items: center; gap: 0.5rem;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            Back to Sign In
          </a>
        </div>

      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/password.js"></script>
</body>
</html>
